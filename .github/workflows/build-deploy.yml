name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-whiteboard
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # GHCR requires a lowercase repository path.
  IMAGE_NAME: ikanasinn/whiteboard-ui

jobs:
  test:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run build` = tsc (typecheck) + vite build, so a broken bundle fails here
      # before any image is pushed.
      - name: Typecheck and build
        run: npm run build

  build:
    name: Build and push UI image
    needs: test
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      # No build args: the app is fully static (nginx) and has no per-environment
      # configuration, so one image serves every environment.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Must match the Dokploy host's architecture (same host as Xpense-Web,
          # linux/arm64); change the workflows together.
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger Dokploy deployment
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        run: |
          missing=0
          for name in DOKPLOY_URL DOKPLOY_APPLICATION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set (Settings → Secrets and variables → Actions → Variables)."
              missing=1
            fi
          done
          if [ -z "$DOKPLOY_API_KEY" ]; then
            echo "::error::Repository secret DOKPLOY_API_KEY is not set."
            missing=1
          fi
          exit $missing
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}

      # Dokploy builds nothing here: the application is switched to a prebuilt
      # image (sourceType "docker"), so the running container is exactly the
      # commit that was checked above. Pin the immutable <sha> tag rather than
      # :latest so a deploy can never silently reuse a cached image, and so a
      # rollback is "re-run an older workflow".
      #
      # saveDockerProvider REPLACES the stored registry credentials, so they are
      # sent only when both GHCR_USER and GHCR_TOKEN exist. Without them the
      # package must be public for the host to pull it.
      - name: Pin UI image to this commit
        run: |
          IMAGE="ghcr.io/${IMAGE_NAME}:${GITHUB_SHA:0:7}"
          echo "Pinning UI image to ${IMAGE}"
          jq -n \
            --arg id "$DOKPLOY_APPLICATION_ID" \
            --arg image "$IMAGE" \
            --arg user "$GHCR_USER" \
            --arg token "$GHCR_TOKEN" \
            '{applicationId: $id,
              dockerImage: $image,
              username: (if $user == "" then null else $user end),
              password: (if $token == "" then null else $token end),
              registryUrl: null}' \
          | curl --fail --silent --show-error --request POST \
              --header "accept: application/json" \
              --header "Content-Type: application/json" \
              --header "x-api-key: $DOKPLOY_API_KEY" \
              --data @- \
              "$DOKPLOY_URL/api/application.saveDockerProvider"
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

      - name: Trigger Dokploy deployment
        run: |
          echo "Calling $DOKPLOY_URL/api/application.deploy"
          curl --fail --silent --show-error --request POST \
            --header "accept: application/json" \
            --header "Content-Type: application/json" \
            --header "x-api-key: $DOKPLOY_API_KEY" \
            --data "{\"applicationId\": \"$DOKPLOY_APPLICATION_ID\"}" \
            "$DOKPLOY_URL/api/application.deploy"
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
